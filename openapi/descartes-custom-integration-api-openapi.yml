    get:
      operationId: getLspofferOfferId
      summary: Details about an Offer
      tags:
      - Custom Integration
      x-source: https://capacitydocs.macropoint.com/
      responses:
        '200':
          description: Success
      description: 'The Details about an Offer API provides the Customer the ability get offer details for a specified open load that has been sent to the MacroPoint Capacity product


        Requirements:


        The Load must be open in the MacroPoint Capacity Product


        An original offer must be created either via the Broker or Carrier.


        If there are no open offers on a load, a blank 200 OK response be received


        The Offer ID is required in the GET Request


