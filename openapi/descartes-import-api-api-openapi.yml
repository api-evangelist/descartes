  /api/v2/Carrier:
    post:
      operationId: postCarrier
      summary: Carrier Import
      tags:
      - Import API
      x-source: https://capacitydocs.macropoint.com/
      responses:
        '200':
          description: Success
      description: 'Carrier Import API request allows customers to post complete carrier lists


        Request Structure


        Title

        Description


        HTTP Method

        POST


        Authentication

        Basic Auth


        Content Type

        APPLICATION/JSON


        Response Format

        JSON


        Header

        Encoded


        Carrier Import Request Schema


        Name

        Name Description

        Value Example

        Required


        Status

        Indicates carrier''s active status within company

        Active

        Yes


        DOTNumber

        Registered FMCSA USDOT number of carrier

        123456

        Yes


        MCNumber

        Registered FMCSA MC Number of carrier. Format: MC prefix required, six digit number required. If carrier has an MC number less than six digits leading zeros must prefix number

        MC987654

        Yes


        Name

        Carrier name

        Awesome Trucking Co.

        Yes


        OwnerName

        Account'
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: "{\n  \"Carriers\": [\n    {\n      \"Status\": \"Active\",\n      \"DOTNumber\": \"1000877\",\n      \"MCNumber\": \"\",\n      \"Name\": \"PostMan Test\",\n      \"CarrierContact\": {\n        \"Name\": \"Post man\",\n        \"Email\": \"post@man.com\",\n        \"Phone\": \"123-456-789\",\n        \"PhoneExtension\": \"\"\n      },\n      \"OwnerName\": \"Eva\",\n      \"DNU\":\"no\",\n      \"Favorite\":\"no\"\n      },\n      {\n      \"Status\": \"Active\",\n      \"DOTNumber\": \"1000222\",\n      \"MCNumber\": \"\",\n      \"Name\": \"PostMan Test\",\n      \"CarrierContact\": {\n        \"Name\": \"Post man\",\n        \"Email\": \"post@man.com\",\n        \"Phone\": \"123-456-789\",\n        \"PhoneExtension\": \"\"\n      },\n      \"OwnerName\": \"Eva\",\n       \"DNU\":\"no\",\n      \"Favorite\":\"no\"\n    }\n  ],\n  \"SessionId\": \"\",\n  \"RequestId\": \"\"\n}"
