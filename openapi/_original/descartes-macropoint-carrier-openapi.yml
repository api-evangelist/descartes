      - Location + Temperature Update
      responses:
        '200':
          description: Success
      description: '<h1 id="location-update-api-calls-allow-carriers-to-send-in-transit-location-updates-to-customers">Location Update API calls allow carriers to send in transit location updates to customers.</h1>

        <h1 id="request-structure">Request Structure</h1>

        <div class="click-to-expand-wrapper is-table-wrapper"><table>

        <thead>

        <tr>

        <th>Title</th>

        <th>Description</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>HTTP Method</td>

        <td>POST</td>

        </tr>

        <tr>

        <td>Authentication</td>

        <td>Basic Auth</td>

        </tr>

        <tr>

        <td>Content Type</td>

        <td>APPLICATION/XML</td>

        </tr>

        <tr>

        <td>Response Format</td>

        <td>XML</td>

        </tr>

        <tr>

        <td>Header</td>

        <td>Encoded</td>

        </tr>

        </tbody>

        </table>

        </div><h2 id="data-throttle">Data Throttle</h2>

        <p>Location updates will be throttled if sent more frequently than 5 minutes per LoadID</p>

        <h1 id="location-update-elements">Location Update Elements</h1>

        <div class="click-to-expand-wrapper is-table-wrapper"><table>

        <thead>

        <tr>

        <th>Element</th>

        <th>Description</th>

        <th>Required</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td><a href="#location-update-sender-tags">Sender</a></td>

        <td>Captures carrier identifier</td>

        <td>Yes</td>

        </tr>

        <tr>

        <td><a href="#location-update-requestor-tags">Requestor</a></td>

        <td>Captures customer information</td>

        <td>Yes</td>

        </tr>

        <tr>

        <td><a href="#location-update-allowaccessfrom-tags">AllowAccessFrom</a></td>

        <td>Captures customer information</td>

        <td>Yes</td>

        </tr>

        <tr>

        <td><a href="#location-update-location-tags">Location</a></td>

        <td>Position of the in transit update'
      requestBody:
        content:
          application/xml:
            schema:
              type: string
            example: "<TMSLocationData xmlns=\"http://macropoint-lite.com/xml/1.0\">\r\n  <Sender>\r\n    <LoadID>ABC123</LoadID>\r\n  </Sender>\r\n  <Requestor>\r\n    <MPID>123456</MPID>\r\n    <LoadID>Load-123</LoadID>\r\
              \n  </Requestor>\r\n  <AllowAccessFrom>\r\n    <MPID>123456</MPID>\r\n  </AllowAccessFrom>\r\n  <Location>\r\n    <Coordinates>\r\n      <Latitude>41.396900</Latitude>\r\n      <Longitude>-81.662491</Longitude>\r\
              \n    </Coordinates>\r\n    <CreatedDateTime>2020-01-01T12:00:00Z</CreatedDateTime>\r\n  </Location>\r\n</TMSLocationData>"
  /api/1.0/tms/data/stopevent:
