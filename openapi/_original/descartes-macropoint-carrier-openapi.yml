        <td>Yes</td>

        </tr>

        <tr>

        <td><a href="#event-update-requestor-tags">Requestor</a></td>

        <td>Captures customer information</td>

        <td>Yes</td>

        </tr>

        <tr>

        <td><a href="#event-update-stop-tags">Stop</a></td>

        <td>Captures stop information of load</td>

        <td>Yes</td>

        </tr>

        <tr>

        <td><a href="#event-update-event-tags">Event</a></td>

        <td>Captures event type and time</td>

        <td>Yes</td>

        </tr>

        </tbody>

        </table>

        </div><h1 id="event-update-sender-tags">Event Update Sender Tags</h1>

        <div class="click-to-expand-wrapper is-table-wrapper"><table>

        <thead'
      requestBody:
        content:
          application/xml:
            schema:
              type: string
            example: "<TMSStopEventData xmlns=\"http://macropoint-lite.com/xml/1.0\">\r\n     <Sender>\r\n          <LoadID>ABC123</LoadID>\r\n     </Sender>\r\n     <Requestor>\r\n          <MPID>123456</MPID>\r\
              \n          <LoadID>Load-123</LoadID>\r\n     </Requestor>\r\n     <Stop>\r\n     <Name>Shipper</Name>\r\n          <StopType>PickUp</StopType>\r\n          <Address>\r\n               <Line1>6050\
              \ Oak Tree Blvd</Line1>\r\n               <City>Independence></City>\r\n               <StateOrProvince>OH</StateOrProvince>\r\n               <PostalCode>44131</PostalCode>\r\n          </Address>\r\
              \n          <SequenceNumber>1</SequenceNumber>\r\n     </Stop>\r\n     <Event>\r\n          <Name>Arrived</Name>\r\n          <CompletedDateTime>2020-01-01T12:00:00Z</CompletedDateTime>\r\n\
              \     </Event>\r\n</TMSStopEventData>"
  /api/1.0/order/trackingnumberassignment:
    post:
      operationId: postOrderTrackingnumberassignment
      summary: Tracking Assignment
      tags:
      - API - XML
      x-source: https://carrierdocs.macropoint.com/
      x-postman-examples:
      - Tracking Assignment
      - Tracking Assignment
      responses:
        '200':
          description: Success
      description: '<h1 id="tracking-assignment-api-calls-allow-carriers-to-assign-driver-information-to-a-tracking-request">Tracking Assignment API calls allow carriers to assign driver information to
        a tracking request</h1>

        <p>Tracking Assignment calls should only be used if you cannot pass Location Updates for loads. If an ELD/GPS connection has already been established to MacroPoint you may automate the assignment
        of vehicle/trailer IDs via this call or you can assign a Mobile number if no connection exists with MacroPoint.</p>

        <h1 id="request-structure">Request Structure</h1>

        <div class="click-to-expand-wrapper is-table-wrapper"><table>

        <thead>

        <tr>

        <th>Title</th>

        <th>Description</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>HTTP Method</td>

        <td>POST</td>

        </tr>

        <tr>

        <td>Authentication</td>

        <td>Basic Auth</td>

        </tr>

        <tr>

        <td>Content Type</td>

        <td>APPLICATION/XML</td>

        </tr>

        <tr>

        <td>Response Format</td>

        <td>XML</td>

        </tr>

        <tr>

        <td>Header</td>

        <td>Encoded</td>

        </tr>

        </tbody>

        </table>

        </div><h1 id="tracking-assignment-update-elements">Tracking Assignment Update Elements</h1>

        <div class="click-to-expand-wrapper is-table-wrapper"><table>

        <thead>

        <tr>

        <th>Element</th>

        <th>Description</th>

        <th>Required</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td><a href="#tracking-assignment-number-tags">Number</a></td>

        <td>Captures the number type and ID used to track</td>

        <td>Yes</td>

        </tr>

        <tr>

        <td><a href="#tracking-assignment-requestor-tags">Requestor</a></td>

        <td>Captures customer information</td>

        <td>Yes</td>

        </tr>

        </tbody>'
      requestBody:
        content:
          application/xml:
            schema:
              type: string
            example: "<TrackingNumberData xmlns=\"http://macropoint-lite.com/xml/1.0\">\r\n <Number Type=\"VehicleID\">1234</Number>\r\n <Requestor>\r\n\t<MPID>123456</MPID>\r\n\t<LoadID>Load-123</LoadID>\r\
              \n </Requestor>\r\n</TrackingNumberData>"
  /api/1.0/tms/data/shipmentstatus:
    post:
      operationId: postTmsDataShipmentstatus
      summary: Enhanced Shipment Status
      tags:
      - API - XML
      x-source: https://carrierdocs.macropoint.com/
      x-postman-examples:
