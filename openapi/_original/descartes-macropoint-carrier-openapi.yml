        </div><h2 id="enhanced-shipment-status-elements">Enhanced Shipment Status Elements</h2>

        <div class="click-to-expand-wrapper is-table-wrapper"><table>

        <thead>

        <tr>

        <th>Element</th>

        <th>Description</th>

        <th>Required</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td><a href="#location-update-sender-tags">Sender</a></td>

        <td>Captures carrier identifier</td>

        <td>Yes</td>

        </tr>

        <tr>

        <td><a href="#location-update-requestor-tags">Requestor</a></td>

        <td>Captures customer information</td>

        <td>Yes</td>

        </tr>

        </tbody>

        </table>

        </div><h2 id="enhanced-shipment-status-tags">Enhanced Shipment Status Tags</h2>

        <div class="click-to-expand-wrapper is-table-wrapper"><table>

        <thead>

        <tr>

        <th>Type</th>

        <th>Description</th>

        <th>Example</th>

        <th><strong>Required</strong></th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>SCAC</td>

        <td>Company''s SCAC</td>

        <td>ABCD</td>

        <td>N'
      requestBody:
        content:
          application/xml:
            schema:
              type: string
            example: "<?xml version=\"1.0\"?>\r\n<TMSShipmentStatus xmlns=\"http://macropoint-lite.com/xml/1.0\">\r\n   <Sender>\r\n    <LoadID>{{SenderLoadID}}</LoadID>\r\n  </Sender>\r\n  <Requestor>\r\
              \n    <MPID>{{RequestorMPID}}</MPID>\r\n    <LoadID>{{RequestorLoadID}}</LoadID>\r\n  </Requestor>\r\n    <ShipmentStatus>\r\n        <SCAC>{CarrierCode}</SCAC>\r\n        <Type>{Estimated\
              \ or Actual}</Type>\r\n        <StatusMessageDetail>{StatusMessageDetail}</StatusMessageDetail>\r\n        <CreatedDateTime>{CreatedDateTime}</CreatedDateTime>\r\n        <City>{City}</City>\r\
              \n        <State>{State}</State>\r\n        <Country>{Country}</Country>\r\n        <EventETA>{EventETA}</EventETA>\r\n    </ShipmentStatus>\r\n</TMSShipmentStatus>\r\n"
  /api/1.0/TMS/Data/FormUpload:
    post:
      operationId: postTMSDataFormUpload
      summary: Form/Document Upload
      tags:
      - API - XML
      x-source: https://carrierdocs.macropoint.com/
      x-postman-examples:
      - Form/Document Upload
      - Form/Document Upload
      responses:
        '200':
          description: Success
      description: '<h1 id="carrier-api-formdocument-upload"><strong>Carrier API form/document upload</strong></h1>

        <p>The FormUpload API allows for the submission of associated shipment documentation, images or related forms.</p>

        <p><strong>Examples:</strong></p>

        <ul>

        <li><p>BOLs</p>

        </li>

        <li><p>PODs</p>

        </li>

        <li><p>Delivery proof images</p>

        </li>

        </ul>

        <h1 id="request-structure">Request Structure</h1>

        <div class="click-to-expand-wrapper is-table-wrapper"><table>

        <thead>

        <tr>

        <th>Title</th>

        <th>Description</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>HTTP Method</td>

        <td>POST</td>

        </tr>

        <tr>

        <td>Authentication</td>

        <td>Basic Auth</td>

        </tr>

        <tr>

        <td>Content Type</td>

        <td>APPLICATION/XML</td>

        </tr>

        <tr>

        <td>Response Format</td>

        <td>XML</td>

        </tr>

        <tr>

        <td>Header</td>

        <td>Encoded</td>

        </tr>

        </tbody>

        </table>

        </div><h1 id="form-upload-elements">Form Upload Elements</h1>

        <div class="click-to-expand-wrapper is-table-wrapper"><table>

        <thead>

        <tr>

        <th><strong>Element</strong></th>

        <th><strong>Description</strong></th>

        <th><strong>Required</strong></th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Sender</td>

        <td>Captures carrier identifier</td>

        <td>Yes</td>

        </tr>

        <tr>

        <td>Requestor</td>

        <td>Captures customer information</td>

        <td>Yes</td>

        </tr>

        <tr>

        <td>StopType</td>

        <td>Captures the type of Stop (PickUp or DropOff)</td>

        <td>No</td>

        </tr>

        <tr>

        <td>Event</td>

        <td>Capatures the type of event (Arrived or Departed)</td>

        <td>No</td>

        </tr>

        <tr>

        <td>Elements</td>

        <td>Captures the document details</td>

        <td>Yes</td>

        </tr>

        </tbody'
      requestBody:
        content:
          application/xml:
            schema:
              type: string
            example: "<?xml version=\"1.0\"?>\r\n<TMSFormData\r\n\txmlns=\"http://macropoint-lite.com/xml/1.0\">\r\n\t<Sender>\r\n\t\t<LoadID>ABC123</LoadID>\r\n\t</Sender>\r\n\t<Requestor>\r\n\t\t<MPID>123456</MPID>\r\
              \n\t\t<LoadID>Load-123</LoadID>\r\n\t</Requestor>\r\n    <StopType>DropOff</StopType><!-- Optional field -->\r\n    <Event>Arrived</Event><!-- Optional field -->\r\n\t<Elements>\r\n\t\t<Element>\r\
              \n\t\t\t<Id>POD</Id>\r\n\t\t\t<Name>POD</Name>\r\n\t\t\t<Type>Binary</Type>\r\n\t\t\t<MimeType>image/png</MimeType>\r\n\t\t\t<Data Encoding=\"Base64\">{{base64EncodedFile}}</Data>\r\n\t\t\
              </Element>\r\n\t</Elements>\r\n</TMSFormData>"
