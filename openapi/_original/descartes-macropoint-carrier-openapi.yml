        </thead>

        <tbody>

        <tr>

        <td>HTTP Method</td>

        <td>POST</td>

        </tr>

        <tr>

        <td>Authentication</td>

        <td>Basic Auth</td>

        </tr>

        <tr>

        <td>Content Type</td>

        <td>APPLICATION/XML</td>

        </tr>

        <tr>

        <td>Response Format</td>

