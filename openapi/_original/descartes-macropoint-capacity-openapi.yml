      description: '<h4 id="the-tms-accept-offer-api-provides-the-tms-the-ability-to-accept-an-offer-by-customer-offerid-via-the-macropoint-capacity-product">The TMS Accept Offer API provides the TMS the
        ability to accept an offer by Customer OfferID via the MacroPoint Capacity product.</h4>

        <p><strong>Requirements:</strong></p>

        <ul>

        <li><p>The Load must be open in the MacroPoint Capacity Product</p>

        </li>

        <li><p>An original offer must be created either via the Broker or Carrier</p>

        </li>

        <li><p>The LSP and OfferID are required in the GET Request</p>

        </li>

        </ul>

        <p>Once the load has been sent to the Descartes MacroPoint Capacity product as accepted, the customer should follow their normal booking process within their TMS to secure the carrier on the load.</p>

