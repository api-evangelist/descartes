        Offer Details API provides the TMS the ability get offer details for a specified open load that has been sent to the MacroPoint Capacity product</h4>

        <p><strong>Requirements:</strong></p>

        <ul>

        <li><p>The Load must be open in the MacroPoint Capacity Product</p>

        </li>

        <li><p>An original offer must be created either via the Broker or Carrier.</p>

        <ul>

        <li>If there are no open offers on a load, a blank 200 OK response be received</li>

        </ul>

        </li>

        <li><p>The LSP is required in the GET Request</p>

        </li>

        </ul>

