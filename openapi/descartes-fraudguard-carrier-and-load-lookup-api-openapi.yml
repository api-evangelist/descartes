        '200':
          description: Success
      description: 'The FraudGuard details can also be retrieved via a link to view the carrier lookup results directly in Descartes MacroPoint.


        To Create the link, build a URL from the carrier''s USDOT number or phone number. Your system then fills in the value for each carrier.


        This feature requires additional account configuration to access. Please contact Descartes Service Desk or work with your implementation rep directly if you are interested.


        URL Formats


        Lookup by US DOT number:


        https://visibility.macropoint.com/carrier-lookup?dotNumber={dotnumber}


        EX: https://visibility.macropoint.com/carrier-lookup?dotNumber=9999999


        Lookup by driver phone number:


        https://visibility.macropoint.com/carrier-lookup?phoneNumber={phonenumber}


        EX: https://visibility.macropoint.com/carrier-lookup?phoneNumber=8888888888


        The carrier DOT and driver phone parameters should be numerica'
