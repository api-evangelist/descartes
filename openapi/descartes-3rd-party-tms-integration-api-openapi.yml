  /api/v1/lspoffer/tms/{lspId}/accept/{offerId}:
    get:
      operationId: getLspofferTmsLspIdAcceptOfferId
      summary: TMS Accept Offer
      tags:
      - 3rd Party TMS Integration
      x-source: https://capacitydocs.macropoint.com/
      responses:
        '200':
          description: Success
      description: 'The TMS Accept Offer API provides the TMS the ability to accept an offer by Customer OfferID via the MacroPoint Capacity product.


        Requirements:


        The Load must be open in the MacroPoint Capacity Product


        An original offer must be created either via the Broker or Carrier


        The LSP and OfferID are required in the GET Request


        Once the load has been sent to the Descartes MacroPoint Capacity product as accepted, the customer should follow their normal booking process within their TMS to secure the carrier on the load.


        Request Structure


        Title

        Description


        HTTP Method

        GET


        Authentication

        Basic Auth


        Content Type

        APPLICATION/JSON


        Response Format

        JSON


        Header

        Encoded


        Request Example:


        https://capacity-offer-api.macropoint.com/api/v1/lspoffer/tms/123456/accept/123.4452


        Respo'
      parameters:
      - name: lspId
        in: path
        required: true
        schema:
          type: string
      - name: offerId
        in: path
        required: true
        schema:
          type: string
      servers:
      - url: https://capacity-offer-api.macropoint.com
  /api/v1/lspoffer/{offerId}:
