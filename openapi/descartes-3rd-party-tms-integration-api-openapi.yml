      operationId: deleteLspofferOfferId
      summary: Rescind Load Offer
      tags:
      - 3rd Party TMS Integration
      x-source: https://capacitydocs.macropoint.com/
      x-postman-examples:
      - Rescind Load Offer
      - Rescind Load Offer
      responses:
        '200':
          description: Success
      description: 'The Rescind Offer API provides the Customer or TMS the ability to rescind an offer by Customer OfferID via the MacroPoint Capacity product.


        Requirements:


        The Load must be open in the MacroPoint Capacity Product


        An original offer must be created either via the Broker or Carrier


        The OfferID is required in the DEL request


        Request Structure


        Title

        Description


        HTTP Method

        GET


        Authentication

        Basic Auth


        Content Type

        APPLICATION/JSON


        Response Format

        JSON


        Header

        Encoded


        Request Example:


        https://capacity-offer-api.macropoint.com/api/v1/lspoffer/


        Response Codes:


        Code

        Description


        204

        Offer Successfully Resinded'
      parameters:
      - name: offerId
        in: path
        required: true
        schema:
          type: string
      servers:
      - url: https://capacity-offer-api.macropoint.com
