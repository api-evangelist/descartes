paths:
  /api/v1/lspoffer:
    put:
      operationId: putLspoffer
      summary: Add an Offer
      tags:
      - 3rd Party TMS Integration
      x-source: https://capacitydocs.macropoint.com/
      x-postman-examples:
      - Add an Offer
      - Add an Offer
      responses:
        '200':
          description: Success
      description: 'The Add an Offer API provides the Customer or TMS the ability to add an offer for an open load that have been sent to the MacroPoint Capacity product


        Requirements:


        The Load must be open in the MacroPoint Capacity Product


        Request Structure


        Title

        Description


        HTTP Method

        GET


        Authentication

        Basic Auth


        Content Type

        APPLICATION/JSON


        Response Format

        JSON


        Header

        Encoded


        Request Schema:


        Name

        Name Description

        Value Example

        Required


        loadId

        The Brokers LoadID provided on the original Load Import

        Load123

        Yes


        carrierDot

        The Carrier DOT associated to the offer

        789456

        Yes


        equipment

        Equipment will be one of the following'
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: "{\n  \"loadId\": \"SampleLoadID\",\n  \"carrierDot\": \"0000000\",\n  \"equipment\": \"Reefer\",\n  \"subEquipemnt\": \"\",\n  \"note\": \"Note\",\n  \"Rate\": 1000,\n  \"LimitRate\": 1500,\n  \"ChildCompany\":\"NW Ohio\"\n}\n"
      servers:
      - url: https://capacity-offer-api.macropoint.com
  /api/v1/lspoffer/tms/{lspId}/{offerId}:
    get:
      operationId: getLspofferTmsLspIdOfferId
      summary: TMS Single Load Offer Details
      tags:
      - 3rd Party TMS Integration
      x-source: https://capacitydocs.macropoint.com/
      responses:
        '200':
          description: Success
      description: 'The TMS Single Offer Details API provides the TMS the ability get offer details for a specified open load that has been sent to the MacroPoint Capacity product


        Requirements:


        The Load must be open in the MacroPoint Capacity Product


        An original offer must be created either via the Broker or Carrier.


        If there are no open offers on a load, a blank 200 OK response be received


        The LSP is required in the GET Request


        Request Structure


        Title

        Description


        HTTP Method

        GET


        Authentication

        Basic Auth


        Content Type

        APPLICATION/JSON


        Response Format

        JSON


        Header

        Encoded


        Request Example:


        https://capacity-offer-api.macropoint.com/api/v1/lspoffer/tms/123456/12345678


        Response Schema:'
      parameters:
      - name: lspId
        in: path
        required: true
        schema:
          type: string
      - name: offerId
        in: path
        required: true
        schema:
          type: string
      servers:
      - url: https://capacity-offer-api.macropoint.com
