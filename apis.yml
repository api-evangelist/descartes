apis:
- aid: descartes:descartes-customsinfo-trade-content-api
  endpointsModeled: true
  name: Descartes CustomsInfo Trade Content API
  tags:
  - Customs Compliance
  - Trade Content
  - HS Classification
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://www.customsinfo.com/knowledge-center/trade-content-apis-streamlining-classification-and-enhancing-business-integration/
  properties:
  - url: >-
      https://www.customsinfo.com/knowledge-center/trade-content-apis-streamlining-classification-and-enhancing-business-integration/
    type: Documentation
  - url: https://www.descartes.com/solutions/customs-and-regulatory-compliance
    type: ProductPage
  description: >-
    Trade content and classification for customs and regulatory compliance. Delivers Harmonized System
    (HS) codes and product classification, current tariff and duty rates and preferential-tariff details,
    binding rulings, import/export restrictions, licensing and safety-certification data, and origin/destination
    trade-agreement content, in JSON or XML for embedding in ERP, GTM, WMS, and TMS systems. No public
    self-service endpoint reference is published; operations are modeled from the CustomsInfo trade-content
    API materials (endpointsModeled) and access is arranged via contract with a Descartes global trade
    content specialist (gated).
- aid: descartes:descartes-datamyne-trade-data-api
  endpointsModeled: true
  name: Descartes Datamyne Global Trade Data API
  tags:
  - Global Trade
  - Trade Data
  - Market Intelligence
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.datamyne.com/our-product/global-trade-data-api/
  properties:
  - url: https://www.datamyne.com/our-product/global-trade-data-api/
    type: Documentation
  - url: >-
      https://www.descartes.com/solutions/customs-and-regulatory-compliance/global-trade-intelligence
    type: ProductPage
  description: >-
    Programmatic access to Descartes Datamyne's global import/export trade data - bill-of-lading and customs
    records, trade flows, and company/commodity intelligence - for embedding market and supply chain intelligence
    into internal applications. No public self-service endpoint reference is published; operations are
    modeled from the Datamyne product materials (endpointsModeled) and access is arranged via subscription/contract
    (gated).
- aid: descartes:descartes-b2b-api-connectivity
  name: Descartes B2B API Connectivity
  tags:
  - B2B Connectivity
  - Global Logistics Network
  - Messaging
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api.descartes.com/
  baseURL: https://api.descartes.com
  properties:
  - url: https://api.descartes.com/
    type: DeveloperPortal
  - url: https://www.descartes.com/solutions/b2b-connectivity-and-messaging/api-connectivity
    type: ProductPage
  description: >-
    Real-time B2B connectivity over the Descartes Global Logistics Network, complementing traditional
    EDI. Provides synchronous request/response integrations for marketplace connectivity (exchanging listings,
    orders, payments, and reports with retailers such as Amazon and bol.com) and multimodal carrier connectivity
    (rates, shipment details, bookings, and waybills). APIs are discovered and keys acquired through the
    Descartes API portal at api.descartes.com, which requires sign-up and approval; specific endpoints
    are modeled from the portal and product materials (endpointsModeled).
